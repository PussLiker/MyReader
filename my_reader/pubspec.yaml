name: my_reader
description: A Flutter application for reading eBooks.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3 # Для SQLite
  path: ^1.9.0 # Для работы с путями файлов
  file_picker: ^8.1.2 # Для выбора файлов
  share_plus: ^10.0.2 # Для шаринга прогресса и цитат
  epubx: ^4.0.0 # для epub
  xml: ^6.5.0 # Для парсинга FB2
  hooks_riverpod: ^2.5.2 # Для управления состоянием

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # Для линтинга кода

flutter:
  uses-material-design: true